syntax = "proto3";

message PrivateDealsV3Api {
  string price = 1;
  string quantity = 2;
  string amount = 3;
  int32 tradeType = 4;
  bool isMaker = 5;
  bool isSelfTrade = 6;
  string tradeId = 7;
  string clientOrderId = 8;
  string orderId = 9;
  string feeAmount = 10;
  string feeCurrency = 11;
  int64 time = 12;
}

message PushDataV3ApiWrapper {
  string channel = 1;
  PrivateDealsV3Api privateDeals = 306;
  optional string symbol = 3;
}
